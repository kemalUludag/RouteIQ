
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routeiq"
version = "0.1.0"
description = "ML-assisted vehicle routing and delivery optimization platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

authors = [
    { name = "Kemal Uludag" }
]

keywords = [
    "vehicle-routing",
    "operations-research",
    "machine-learning",
    "optimization",
    "cvrp",
    "predict-then-optimize",
]

dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "ortools==9.15.6755",
    "gurobipy==13.0.3",
    "matplotlib==3.11.1",
]

[project.urls]
Repository = "https://github.com/kemalUludag/RouteIQ"
Issues = "https://github.com/kemalUludag/RouteIQ/issues"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["routeiq*"]

