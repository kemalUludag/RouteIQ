[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routeiq"
version = "0.1.0"
description = "ML-assisted vehicle routing and delivery optimization platform"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "ortools==9.15.6755",
    "gurobipy==13.0.3",
    "matplotlib==3.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["routeiq*"]
